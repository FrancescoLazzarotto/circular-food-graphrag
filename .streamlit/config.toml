# Base palette for the browser demo. Deliberately restrained: this is the
# starting point for the visual work, not the finished identity.
#
# Streamlit reads this from the working directory, which is why it sits at the
# repository root rather than next to product/app.py — scripts/serving/start_demo.sh
# cd's here before launching.
#
# The default theme puts Streamlit's own red on every button and accent, which
# says "prototype in someone's notebook". The accent below is a muted slate
# teal: it reads as considered without claiming a brand, and it stays legible
# against both grounds. Neutrals carry a slight warm bias so the page does not
# look like unstyled HTML.

[theme]
base = "light"
primaryColor = "#2F6D68"
backgroundColor = "#FCFBF9"
secondaryBackgroundColor = "#F2EFEA"
textColor = "#1F2321"
linkColor = "#2F6D68"
borderColor = "#E0DAD1"
font = "sans-serif"
codeFont = "monospace"
baseRadius = "small"

[server]
# The demo is reached through an SSH tunnel or VS Code's port forwarding;
# nothing here is a public origin.
headless = true

# Streamlit validates the websocket's Origin header against browser.serverAddress
# and rejects a mismatch with 403. Through a plain `ssh -L` tunnel the origin is
# localhost and it matches; through VS Code's forwarding the page is served from
# a *.devtunnels.ms domain, so the HTML loads, the websocket is refused, and the
# page spins forever with no error anywhere — measured: origin localhost -> 101,
# origin devtunnels -> 403.
#
# The protection this drops guards Streamlit's file-upload endpoint against a
# malicious page driving it cross-origin. This app has no upload, and the port is
# reachable only from this machine's network.
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[client]
# "viewer" keeps the page menu and drops the developer entries, among them the
# "Deploy" button, which offers a reader something they cannot use.
toolbarMode = "viewer"
