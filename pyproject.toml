[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-pipeline"
version = "0.2.0"
description = "GraphRAG pipeline with Neo4j retrieval and local Hugging Face generation"
readme = "README.md"
requires-python = ">=3.10"
# Version bounds mirror requirements.txt so `pip install -e .` and
# `pip install -r requirements.txt` resolve to the same environment. The one
# deliberate divergence is psutil: requirements pinned `<7.0`, but the working
# environment runs 7.2.2, so the cap would have downgraded a healthy install.
# Only psutil.Process / cpu_percent / virtual_memory are used, all unchanged in 7.x.
dependencies = [
    "torch>=2.3,<3.0",
    "langchain-community>=0.3,<0.4",
    "langchain-neo4j",
    "langchain-huggingface>=0.1,<0.2",
    "langchain-core>=0.3,<0.4",
    "langgraph>=0.2,<0.4",
    # The vLLM / OpenAI-compatible generation path imports this at call time
    # (llm/manager.py). It was in requirements-gpu.txt but not here, so
    # `pip install -e .` produced a package that failed on every vLLM run and
    # told the user to install it by hand.
    "langchain-openai>=0.2,<0.4",
    "transformers>=4.45,<5.0",
    "accelerate>=1.0,<2.0",
    "neo4j>=5.20,<6.0",
    "python-dotenv>=1.0,<2.0",
    "pymupdf>=1.24,<2.0",
    "psutil>=5.9,<9.0",
    # Imported at module import time by kg_pipeline and graphrag.embeddings
    # (audit §5.2). Capped below 2.0: the 2.0 wheel on PyPI carries no module,
    # so `import pymupdf4llm` fails after a clean install.
    "pymupdf4llm>=0.0.17,<2.0",
    "gliner>=0.2,<1.0",
    "openai>=1.40",
    "pyyaml>=6.0,<7.0",
    "requests>=2.31,<3.0",
    "faiss-cpu>=1.7,<2.0",
    "sentence-transformers>=3.0,<4.0",
    # Without it evalkit falls back to a simplified local BLEU, so a published
    # metric silently stops coming from the reference implementation.
    "sacrebleu>=2.4,<3.0",
]

[project.optional-dependencies]
# GPU nodes. torch/torchvision stay out on purpose: they need the +cu124 wheels
# and the extra index URL, which only requirements-gpu.txt can express.
gpu = [
    "bitsandbytes>=0.43,<0.47",
    "autoawq>=0.2",
    "vllm>=0.4,<1.0",
]
# Heavier evaluation workflows: mirrors evaluation/requirements.txt.
eval = [
    "ragas>=0.1.10",
    "pandas>=2.0",
    "datasets>=2.14",
    "rouge-score>=0.1.2",
    "matplotlib>=3.7",
    "numpy>=1.24",
]
# The browser demo handed to domain experts.
demo = [
    "streamlit>=1.30",
]
# Test tooling. The majors are capped to the ones the suite was verified
# against (pytest 8.4, pytest-cov 5.0): an unpinned major would let CI run a
# tool release nobody has reproduced locally and report a failure that is the
# tool's, not the code's.
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
graphrag-demo = "graphrag.cli:main"
graphrag-eval = "evalkit.cli:main"
graphrag-kg = "kg_pipeline.main:main"

# Three package roots: the engine under src/, the evaluation toolkit under
# evaluation/, the KG pipeline at the repository root. `packages` is listed
# explicitly rather than auto-discovered because automatic discovery cannot span
# three roots — the cost is one line per new subpackage, which is rarer than a
# release. Listing them also means the wheel carries only the declared modules:
# kg_pipeline/ sits alongside 381 MB of artifacts, run logs and two .env files
# holding a Neo4j password, and none of it is packaged.
[tool.setuptools]
package-dir = {"" = "src", "evalkit" = "evaluation/evalkit", "kg_pipeline" = "kg_pipeline"}
packages = [
    "graphrag",
    "graphrag.agent",
    "graphrag.experiments",
    "graphrag.kg",
    "graphrag.llm",
    "graphrag.text_rag",
    "evalkit",
    "evalkit.io",
    "evalkit.judge",
    "evalkit.kg",
    "evalkit.metrics",
    "evalkit.report",
    "kg_pipeline",
    "kg_pipeline.models",
    "kg_pipeline.prompts",
    "kg_pipeline.stages",
    "kg_pipeline.utils",
]

[tool.pytest.ini_options]
# `kg_pipeline` is a top-level package in the repo root and `evalkit` lives under
# evaluation/. Declaring them here is what lets the suite run from any working
# directory instead of relying on pytest putting the cwd on sys.path.
pythonpath = [".", "src", "evaluation"]
testpaths = ["tests", "kg_pipeline/tests", "evaluation/tests"]


[tool.ruff]
# The library and the product only. `scripts/`, `evaluation/` and `kg_pipeline/`
# put a `sys.path` insert before their imports on purpose, which is 49 E402s
# that are not defects; linting them would mean either a red gate on arrival or
# an ignore so broad it stops meaning anything. `src` and `product` pass clean
# today, so the gate holds from the first run.
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
# Ruff's own default set, written out so it cannot drift with a ruff release:
# the pycodestyle errors that catch real mistakes, plus pyflakes. Deliberately
# not a style opinion — E501 in particular is left off, because the codebase
# has its own line-length habit and a lint gate is not the place to relitigate
# it. Measured before enabling: `src` and `product` are already clean here.
select = ["E4", "E7", "E9", "F"]
